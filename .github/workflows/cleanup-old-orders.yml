name: Daily Cleanup - Delete Orders Older Than 60 Days

# Schedule: runs every day at 2:00 AM UTC (10:00 AM UTC+8)
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Perform a dry run (no actual deletion)'
        required: false
        default: 'false'
      retentionDays:
        description: 'Number of days to retain orders (default: 60)'
        required: false
        default: '60'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup old orders (completed orders older than 60 days)
        run: |
          # Call the cleanup-old-orders edge function
          curl -X POST \
            https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/cleanup-old-orders \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "dryRun": false,
              "retentionDays": 60
            }' \
            -w "\nHTTP Status: %{http_code}\n"

      - name: Verify cleanup completion
        run: |
          echo "Daily cleanup scheduled for completed orders older than 60 days"
          echo "- Deletes: completed orders + associated order_items + old sync_logs"
          echo "- Keeps: all orders younger than 60 days OR any incomplete orders"
          echo "- Frequency: Daily at 2 AM UTC"
